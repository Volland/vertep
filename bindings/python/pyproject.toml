[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "vertep"
version = "0.1.11"
description = "W3C SCXML statecharts as durable, journaled actors, from Python: typed events, time travel, SPARQL over the state graph"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Volodymyr Pavlyshyn" }]
keywords = ["scxml", "statechart", "state-machine", "actor", "event-sourcing", "rdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://volland.github.io/vertep/"
Documentation = "https://volland.github.io/vertep/docs/python.html"
Repository = "https://github.com/Volland/vertep"
Changelog = "https://github.com/Volland/vertep/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.vertep]
# Stability tier, rendered into the README and the site by site/tools/tiers.py.
tier = "preview"
tier-reason = "pytest runs every scenario and example on CPython 3.9 and 3.13; on PyPI since 0.1.9; no agents, cluster or federation yet"

[tool.maturin]
manifest-path = "../../crates/vertep-py/Cargo.toml"
python-source = "python"
module-name = "vertep._vertep"
include = [{ path = "LICENSE-*", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
