[package]
name = "vertep-py"
description = "Vertep for Python: the actor system's command bridge as a PyO3 extension module (the native half of the `vertep` package on PyPI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Shipped as the `vertep` wheel and sdist built by maturin from `bindings/python`, not on crates.io.
publish = false

[package.metadata.vertep]
# Stability tier: stable, preview or experimental (site/docs/tiers.html). Rendered into the
# README and the site by site/tools/tiers.py; CI fails when they differ.
tier = "preview"
tier-reason = "pytest runs every scenario and example on CPython 3.9 and 3.13; ships as the vertep wheel, not on crates.io"

[lib]
name = "_vertep"
crate-type = ["cdylib", "rlib"]
# The tests are Python's (`bindings/python/tests`). A Rust test binary would link libpython, which
# `cargo test --workspace` should not need.
test = false
doctest = false

[features]
default = []
# The ECMAScript datamodel (boa) for charts that name `datamodel="ecmascript"`. It adds several
# megabytes to the wheel, so the default wheel leaves it out.
ecmascript = ["vertep-wasm/ecmascript"]

[dependencies]
# abi3: one wheel per platform for every CPython from 3.9 on.
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
vertep-wasm = { path = "../vertep-wasm", features = ["journal", "agent"] }
vertep-runtime = { workspace = true }
serde_json = "1"

# No `[lints] workspace = true`: the `#[pyclass]` and `#[pymodule]` macros emit `unsafe` glue and
# the workspace forbids it (as for `vertep-wasm`).
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
