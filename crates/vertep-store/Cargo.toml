[package]
name = "vertep-store"
description = "Storage contracts for Vertep: JournalStore, GraphStore and their test kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-store"
keywords = ["vertep", "event-sourcing", "journal", "rdf", "sparql"]
categories = ["database"]

[package.metadata.vertep]
# Stability tier: stable, preview or experimental (site/docs/tiers.html). Rendered into the
# README and the site by site/tools/tiers.py; CI fails when they differ.
tier = "stable"
tier-reason = "The journal and graph contracts and their test kit; the journal protocol is checked against the Lean model"

[features]
default = []
# The shared backend test kit (`vertep_store::testkit`): every backend runs it from its tests.
testkit = []

[dependencies]
oxrdf = { workspace = true }
spargebra = { workspace = true }
spareval = { workspace = true }

[dev-dependencies]
vertep-store = { path = ".", features = ["testkit"] }

[lints]
workspace = true
