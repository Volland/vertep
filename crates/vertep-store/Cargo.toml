[package]
name = "vertep-store"
description = "Storage contracts for Vertep: JournalStore, GraphStore and their test kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-store"
keywords = ["vertep", "event-sourcing", "journal", "rdf", "sparql"]
categories = ["database"]

[features]
default = []
# The shared backend test kit (`vertep_store::testkit`): every backend runs it from its tests.
testkit = []

[dependencies]
oxrdf = { workspace = true }
spargebra = { workspace = true }
spareval = { workspace = true }

[dev-dependencies]
vertep-store = { path = ".", features = ["testkit"] }

[lints]
workspace = true
