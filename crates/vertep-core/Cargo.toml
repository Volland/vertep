[package]
name = "vertep-core"
description = "Chart IR, validation and the pure SCXML step kernel for Vertep (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-core"
keywords = ["scxml", "statechart", "state-machine", "no-std", "interpreter"]
categories = ["no-std", "data-structures", "algorithms"]

[package.metadata.vertep]
# Stability tier: stable, preview or experimental (site/docs/tiers.html). Rendered into the
# README and the site by site/tools/tiers.py; CI fails when they differ.
tier = "stable"
tier-reason = "W3C SCXML IRP suite in CI, Rust-against-Lean differential traces, type soundness of step proven in Lean, no_std and wasm32 builds in CI"

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[lints]
workspace = true
