[package]
name = "vertep-yaml"
description = "YAML surface for Vertep charts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-yaml"
keywords = ["yaml", "statechart", "scxml", "state-machine", "parser"]
categories = ["parser-implementations", "encoding"]

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
# YAML 1.2 event parser with source spans; keeps mapping order because we build the tree.
saphyr-parser = "0.3.3"

[dev-dependencies]
proptest = "1.12"
vertep-testkit = { workspace = true }
vertep-scxml = { workspace = true }

[lints]
workspace = true
