[package]
name = "vertep-agent"
description = "Deciders, LLM actors, tools with grants and sandboxed plan charts for Vertep agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The reference provider: the Anthropic Messages API (request and response mapping over an
# `HttpClient` the application supplies; no HTTP stack is pulled in).
anthropic = []

[dependencies]
vertep-core = { workspace = true, features = ["std", "serde"] }
vertep-runtime = { workspace = true }
vertep-dm-cel = { workspace = true }
vertep-rdf = { workspace = true }
vertep-yaml = { workspace = true }
oxrdf = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `pattern` in the JSON Schema validator.
regex = "1.13"
futures = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
vertep-scxml = { workspace = true }
vertep-dm-ecma = { workspace = true }
vertep-store = { workspace = true }
spargebra = { workspace = true }
spareval = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }

[lints]
workspace = true
