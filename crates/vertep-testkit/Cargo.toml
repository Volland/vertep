[package]
name = "vertep-testkit"
description = "Property-test generators for Vertep charts (test-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
# Without the default `fork` and `timeout` features (unused), so it also builds for
# wasm32-unknown-unknown (through vertep-conformance in `vertep-wasm`).
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true
