[package]
name = "vertep-scxml"
description = "SCXML reader and writer for Vertep charts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-scxml"
keywords = ["scxml", "statechart", "xml", "state-machine", "parser"]
categories = ["parser-implementations", "encoding"]

[package.metadata.vertep]
# Stability tier: stable, preview or experimental (site/docs/tiers.html). Rendered into the
# README and the site by site/tools/tiers.py; CI fails when they differ.
tier = "stable"
tier-reason = "Reads the whole W3C SCXML suite in CI; SCXML and RDF round trips over the suite"

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
quick-xml = "0.42"

[dev-dependencies]
vertep-testkit = { workspace = true }
proptest = "1.12"

[lints]
workspace = true
