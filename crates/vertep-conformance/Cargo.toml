[package]
name = "vertep-conformance"
description = "W3C SCXML IRP conformance harness and differential tests for Vertep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Rust-versus-Lean differential tests (tasks 8.6, 8.9); run in CI with
# `cargo test -p vertep-conformance --features differential -- --ignored differential`.
differential = []

[dependencies]
vertep-core = { workspace = true, features = ["std", "serde"] }
vertep-scxml = { workspace = true }
vertep-dm-ecma = { workspace = true }
vertep-dm-cel = { workspace = true }
vertep-rdf = { workspace = true }
vertep-testkit = { workspace = true }
# Without the default `fork` and `timeout` features (unused), so the harness also builds for
# wasm32-unknown-unknown (the IRP suite in WebAssembly, `vertep-wasm` feature `conformance`).
proptest = { version = "1.12", default-features = false, features = ["std"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
# Journal protocol property tests against the Lean model (verification-backlog 5.6).
vertep-runtime = { workspace = true }
vertep-store = { workspace = true }
# Decide-state differential tests against the Lean decider model (m3-agents 8.5).
vertep-agent = { workspace = true }

[lints]
workspace = true
