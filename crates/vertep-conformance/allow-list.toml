# XML DOM values in the ecmascript datamodel (W3C SCXML B.2.2)

[[deviation]]
test = "557"
datamodel = "ecmascript"
reason = "needs XML content turned into an ECMAScript DOM object (getElementsByTagName); the boa engine has no DOM, so vertep-dm-ecma keeps XML content as a string"

[[deviation]]
test = "561"
datamodel = "ecmascript"
reason = "needs XML content turned into an ECMAScript DOM object (getElementsByTagName); the boa engine has no DOM, so vertep-dm-ecma keeps XML content as a string"

# Guard purity

[[deviation]]
test = "444"
datamodel = "ecmascript"
reason = "the condition `++var1==2` modifies the datamodel; Vertep evaluates conditions against a read-only scope (design decision D4, openspec datamodel#Guard Purity), so the guard is an evaluation error by design"

