# Expected deviations from the W3C SCXML IRP suite on the Rust core.
#
# Every entry names the test, the datamodel of the variant and why the failure is outside
# Vertep's control. An allow-listed test that passes fails the run, so remove its entry; an
# entry without a reason, or naming a test the suite does not have, is rejected.
#

# Basic HTTP Event I/O Processor (W3C SCXML Appendix C.2)

