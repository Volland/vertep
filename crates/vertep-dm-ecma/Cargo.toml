[package]
name = "vertep-dm-ecma"
description = "ECMAScript datamodel for Vertep on the boa engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-dm-ecma"
keywords = ["ecmascript", "javascript", "scxml", "statechart", "boa"]
categories = ["compilers"]

[package.metadata.vertep]
# Stability tier: stable, preview or experimental (site/docs/tiers.html). Rendered into the
# README and the site by site/tools/tiers.py; CI fails when they differ.
tier = "stable"
tier-reason = "The ecmascript variant of the W3C SCXML suite in CI"

[features]
default = ["ecmascript"]
ecmascript = ["dep:boa_engine"]

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
boa_engine = { workspace = true, optional = true }

[lints]
workspace = true
