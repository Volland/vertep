[package]
name = "vertep-dm-ecma"
description = "ECMAScript datamodel for Vertep on the boa engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-dm-ecma"
keywords = ["ecmascript", "javascript", "scxml", "statechart", "boa"]
categories = ["compilers"]

[features]
default = ["ecmascript"]
ecmascript = ["dep:boa_engine"]

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
boa_engine = { workspace = true, optional = true }

[lints]
workspace = true
