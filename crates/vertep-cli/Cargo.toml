[package]
name = "vertep-cli"
description = "The vt command line: typecheck, schema, validate, hash, convert, certify, generate code, clusters, did:webvh, wallets, explanations, bundles, rules and agent protocols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-cli"
keywords = ["scxml", "statecharts", "rdf", "cli", "lean"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.vertep]
# Stability tier: stable, preview or experimental (site/docs/tiers.html). Rendered into the
# README and the site by site/tools/tiers.py; CI fails when they differ.
tier = "preview"
tier-reason = "Commands held to recorded output by the examples tests; explain, verify-bundle and rules are new"

[[bin]]
name = "vt"
path = "src/main.rs"

[features]
default = []
# vt rules: rule programs, bundles and counterfactuals; links the native engine library
# (`LEANELPI_DIST`), so it is off by default.
rules = ["vertep-rules/native"]

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
vertep-scxml = { workspace = true }
vertep-yaml = { workspace = true }
vertep-rdf = { workspace = true }
vertep-dm-cel = { workspace = true }
vertep-cluster = { workspace = true, features = ["tiramemsu"] }
oxrdf = { workspace = true }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
# vt webvh: did:webvh authoring, witnessing, publishing and serving.
vertep-webvh = { workspace = true, features = ["custody", "server"] }
vertep-federation = { workspace = true }
# vt kolyada: agent protocol documents, offers, histories and vectors.
vertep-kolyada = { workspace = true }
base64 = "0.22"
vertep-objects = { workspace = true }
serde = { version = "1", features = ["derive"] }
vertep-rules = { workspace = true }
vertep-agent = { workspace = true }
vertep-tiramemsu = { workspace = true }
# vt wallet: agent wallets, OpenID4VCI offers and the conformance kit.
vertep-wallet = { workspace = true, features = ["sd-jwt", "oid4vc", "testkit"] }
vertep-runtime = { workspace = true }
getrandom = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time"] }
axum = { version = "0.7.9", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tempfile = "3"
vertep-agent = { workspace = true }
futures = "0.3"
vertep-wallet = { workspace = true }
vertep-store = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
