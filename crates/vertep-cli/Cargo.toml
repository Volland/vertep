[package]
name = "vertep-cli"
description = "The vt command line: typecheck, schema, validate, hash, convert, certify and did:webvh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-cli"
keywords = ["scxml", "statecharts", "rdf", "cli", "lean"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "vt"
path = "src/main.rs"

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
vertep-scxml = { workspace = true }
vertep-yaml = { workspace = true }
vertep-rdf = { workspace = true }
vertep-dm-cel = { workspace = true }
vertep-cluster = { workspace = true, features = ["tiramemsu"] }
oxrdf = { workspace = true }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
# vt webvh: did:webvh authoring, witnessing, publishing and serving.
vertep-webvh = { workspace = true, features = ["custody", "server"] }
vertep-federation = { workspace = true }
vertep-objects = { workspace = true }
serde = { version = "1", features = ["derive"] }
# vt wallet: agent wallets, OpenID4VCI offers and the conformance kit.
vertep-wallet = { workspace = true, features = ["sd-jwt", "oid4vc", "testkit"] }
vertep-runtime = { workspace = true }
getrandom = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time"] }
axum = { version = "0.7.9", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tempfile = "3"
vertep-wallet = { workspace = true }
vertep-tiramemsu = { workspace = true }
vertep-store = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
