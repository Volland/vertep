[package]
name = "vertep-cli"
description = "The vt command line: typecheck, schema, validate, hash, convert and certify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vt"
path = "src/main.rs"

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
vertep-scxml = { workspace = true }
vertep-yaml = { workspace = true }
vertep-rdf = { workspace = true }
vertep-dm-cel = { workspace = true }
oxrdf = { workspace = true }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
