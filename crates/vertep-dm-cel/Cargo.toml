[package]
name = "vertep-dm-cel"
description = "CEL datamodel for Vertep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-dm-cel"
keywords = ["cel", "expression", "interpreter", "statechart", "no-std"]
categories = ["compilers", "no-std"]

[features]
default = ["std"]
# Only forwards `std` to vertep-core; the CEL datamodel itself is `no_std` with `alloc`.
std = ["vertep-core/std"]

[dependencies]
vertep-core = { workspace = true }
regex-automata = { workspace = true }

[dev-dependencies]
vertep-yaml = { workspace = true }

[lints]
workspace = true
