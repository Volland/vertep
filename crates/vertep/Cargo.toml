[package]
name = "vertep"
description = "SCXML statecharts, virtual actors and AI agents with charts as RDF: the Vertep facade crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep"
keywords = ["scxml", "statechart", "actor", "rdf", "state-machine"]
categories = ["asynchronous", "concurrency", "data-structures"]

[features]
default = ["runtime", "tiramemsu", "scxml"]
# The actor runtime (vertep-runtime) on tokio.
runtime = ["dep:vertep-runtime"]
# The tiramemsu storage backend, with `Storage` for it.
tiramemsu = ["runtime", "dep:vertep-tiramemsu", "vertep-runtime/tiramemsu"]
# The SCXML reader and writer.
scxml = ["dep:vertep-scxml"]
# The ECMAScript datamodel.
ecmascript = ["dep:vertep-dm-ecma"]
# Agents: decide states and deciders, LLM and tool actors, grants and plan charts.
agent = ["runtime", "dep:vertep-agent"]
# Federation: DID identities, grants, and DIDComm v2 and TSP relay mailboxes and transports.
federation = ["runtime", "dep:vertep-federation", "vertep-federation/didcomm", "vertep-federation/tsp"]
# Trusted clusters: membership, shard leases and placement, QUIC transport and worker pools.
cluster = ["runtime", "dep:vertep-cluster", "vertep-cluster/gossip", "vertep-cluster/quic", "vertep-cluster/runtime"]
# Durable objects: verifiable journals and decentralised custody over TSP.
objects = ["runtime", "federation", "dep:vertep-objects", "vertep-objects/tsp"]
# Agent wallets: sealed credentials, consent, pluggable exchange protocols and formats.
wallet = ["agent", "federation", "dep:vertep-wallet", "vertep-wallet/tsp", "vertep-wallet/sd-jwt"]

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
vertep-store = { workspace = true }
vertep-rdf = { workspace = true }
vertep-runtime = { workspace = true, optional = true }
vertep-tiramemsu = { workspace = true, optional = true }
vertep-scxml = { workspace = true, optional = true }
vertep-dm-ecma = { workspace = true, optional = true }
vertep-agent = { workspace = true, optional = true }
vertep-federation = { workspace = true, optional = true }
vertep-objects = { workspace = true, optional = true }
vertep-cluster = { workspace = true, optional = true }
vertep-wallet = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[[example]]
name = "quickstart"
required-features = ["runtime", "tiramemsu", "scxml"]

[lints]
workspace = true
