[package]
name = "vertep-tiramemsu"
description = "Tiramemsu backend for Vertep journals and graphs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-tiramemsu"
keywords = ["vertep", "event-sourcing", "rdf", "bitemporal", "triple-store"]
categories = ["database"]

[dependencies]
vertep-store = { workspace = true }
oxrdf = { workspace = true }
tiramemsu = { workspace = true }

[dev-dependencies]
vertep-store = { workspace = true, features = ["testkit"] }
tempfile = "3"

[lints]
workspace = true
