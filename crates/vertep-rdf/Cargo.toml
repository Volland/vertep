[package]
name = "vertep-rdf"
description = "RDF 1.2 projection, vt ontology, SHACL shapes and canonical hashing for Vertep charts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-rdf"
keywords = ["rdf", "shacl", "ontology", "statechart", "semantic-web"]
categories = ["encoding", "science", "data-structures"]

[dependencies]
vertep-core = { workspace = true, features = ["std"] }
# RDF 1.2 terms (triple terms, directional literals) and the RDFC-1.0 blank node labelling.
oxrdf = { version = "0.3.5", features = ["rdf-12", "rdfc-10"] }
# Turtle, TriG, N-Triples and N-Quads in their RDF 1.2 versions.
oxttl = { version = "0.2.5", features = ["rdf-12"] }
sha2 = "0.10"
# `sh:pattern` in the SHACL validator.
regex = "1.13"
# The JSON Schema projection of types.
serde_json = "1"

[dev-dependencies]
vertep-testkit = { workspace = true }
vertep-scxml = { workspace = true }
proptest = "1.12"
# An independent JSON Schema 2020-12 validator for the projection agreement tests.
jsonschema = { version = "0.61", default-features = false }

[lints]
workspace = true
