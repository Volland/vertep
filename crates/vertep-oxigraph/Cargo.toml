[package]
name = "vertep-oxigraph"
description = "Oxigraph and SPARQL 1.1 graph store adapter for Vertep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-oxigraph"
keywords = ["vertep", "oxigraph", "sparql", "rdf", "graph-store"]
categories = ["database"]

[package.metadata.vertep]
# Stability tier: stable, preview or experimental (site/docs/tiers.html). Rendered into the
# README and the site by site/tools/tiers.py; CI fails when they differ.
tier = "preview"
tier-reason = "Passes the store contract kit; used by no example"

[dependencies]
vertep-store = { workspace = true }
oxrdf = { workspace = true }
oxigraph = { workspace = true }
sparesults = { workspace = true }

[dev-dependencies]
vertep-store = { workspace = true, features = ["testkit"] }
vertep-tiramemsu = { workspace = true }
tempfile = "3"

[lints]
workspace = true
