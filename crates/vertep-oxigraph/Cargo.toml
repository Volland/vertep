[package]
name = "vertep-oxigraph"
description = "Oxigraph and SPARQL 1.1 graph store adapter for Vertep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-oxigraph"
keywords = ["vertep", "oxigraph", "sparql", "rdf", "graph-store"]
categories = ["database"]

[dependencies]
vertep-store = { workspace = true }
oxrdf = { workspace = true }
oxigraph = { workspace = true }
sparesults = { workspace = true }

[dev-dependencies]
vertep-store = { workspace = true, features = ["testkit"] }
vertep-tiramemsu = { workspace = true }
tempfile = "3"

[lints]
workspace = true
