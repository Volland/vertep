[package]
name = "vertep-runtime"
description = "Event-sourced actor runtime for Vertep: activations, mailboxes, journal, timers and versioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage = "https://volland.github.io/vertep/"
documentation = "https://docs.rs/vertep-runtime"
keywords = ["statecharts", "scxml", "actors", "event-sourcing", "durable"]
categories = ["asynchronous", "concurrency"]

[features]
default = []
# `Storage` for the tiramemsu backend.
tiramemsu = ["dep:vertep-tiramemsu"]
# The server end of the WebSocket Event I/O Processor (`websocket::server`, on tokio and
# tokio-tungstenite). The frames and the link state are always built: the browser shell uses them.
websocket = ["dep:tokio-tungstenite", "tokio/net", "tokio/macros"]

[dependencies]
vertep-core = { workspace = true, features = ["std", "serde"] }
vertep-store = { workspace = true }
vertep-rdf = { workspace = true }
vertep-scxml = { workspace = true }
vertep-tiramemsu = { workspace = true, optional = true }
oxrdf = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true, features = ["sync", "time", "rt"] }
futures = { workspace = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }

[dev-dependencies]
vertep-runtime = { path = ".", features = ["tiramemsu"] }
vertep-dm-ecma = { workspace = true }
vertep-yaml = { workspace = true }
vertep-dm-cel = { workspace = true }
vertep-tiramemsu = { workspace = true }
vertep-store = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tempfile = "3"
futures = { workspace = true }
# The client side of the WebSocket endpoint tests.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }

[lints]
workspace = true
