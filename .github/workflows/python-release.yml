# Builds the `vertep` wheels and sdist from bindings/python and publishes them to PyPI.
#
#   - Run it by hand (Actions > Python release > Run workflow) to build every wheel and keep them
#     as a workflow artifact without publishing: the dry run to do before the first tag.
#   - "Publish to TestPyPI" on a manual run uploads to test.pypi.org.
#   - Publishing a GitHub release (tag vX.Y.Z) uploads to pypi.org.
#
# Uploads use PyPI Trusted Publishing (OpenID Connect): no API token is stored anywhere. The
# setup is in bindings/python/RELEASING.md.
name: Python release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish to TestPyPI after building
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag, the PyPI package and the Cargo workspace carry one version
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            python bindings/python/scripts/check_version.py "${{ github.ref_name }}"
          else
            python bindings/python/scripts/check_version.py
          fi

  wheels:
    name: Wheels for ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: macos-15-intel, target: x86_64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: true
      - name: Smoke test the wheel (a fresh environment, nothing from the checkout)
        shell: bash
        run: |
          python -m venv smoke
          if [ -d smoke/Scripts ]; then . smoke/Scripts/activate; else . smoke/bin/activate; fi
          pip install --no-index --find-links bindings/python/dist vertep
          python -I bindings/python/scripts/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist

  sdist:
    name: Source distribution
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/vertep/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vertep/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
