name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: vertep-core builds without std
        run: cargo build -p vertep-core --no-default-features --target thumbv7em-none-eabihf

  rules:
    name: Rules (native engine)
    runs-on: ubuntu-latest
    env:
      LEANELPI_TAG: v0.4.1
      LEANELPI_SHA256: ad0cf6d5345e70005b6f56e0b95070566ced0f49ff865d05bb2b951be2f64f8a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Without the engine the crate links no native library and the browser build never sees it
        run: |
          cargo test -p vertep-rules
          cargo test -p vertep-cli --test rules
          if cargo tree -p vertep-rules -i leanelpi 2>/dev/null; then echo "leanelpi linked without the native feature"; exit 1; fi
          if cargo tree -p vertep-wasm -i vertep-rules 2>/dev/null; then echo "vertep-rules reaches the wasm build"; exit 1; fi
      - name: Fetch libleanelpi (checksum pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/leanelpi"
          curl -fsSL -o "$RUNNER_TEMP/leanelpi.tgz" "https://github.com/Volland/lean-elpi/releases/download/${LEANELPI_TAG}/libleanelpi-linux-x64.tar.gz"
          echo "${LEANELPI_SHA256}  $RUNNER_TEMP/leanelpi.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/leanelpi.tgz" -C "$RUNNER_TEMP/leanelpi"
          echo "LEANELPI_DIST=$RUNNER_TEMP/leanelpi" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/leanelpi" >> "$GITHUB_ENV"
      - name: Vectors against the real engine
        run: |
          cargo test -p vertep-rules --features native
          cargo test -p vertep-cli --features rules --test rules
          cargo clippy -p vertep-rules --features native --all-targets -- -D warnings

  lean:
    name: Lean model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/vertep-lean
          build: true
          test: false
      - name: No sorry and axiom hygiene
        working-directory: lean/vertep-lean
        run: ./scripts/check.sh

  conformance:
    name: W3C SCXML conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Suite hash
        run: ./crates/vertep-conformance/scripts/check-suite-hash.sh
      - name: Mandatory tests on the Rust core
        run: cargo test -p vertep-conformance --release -- --nocapture conformance

  traceability:
    name: tg graph and OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@1.9.0
      - run: openspec validate --all --strict
      # production-readiness: Stability Tiers. Every crate and package declares a tier, and the
      # README and site/docs/tiers.html tables are the ones its manifests render.
      - name: Stability tier tables match the manifests
        run: python3 site/tools/tiers.py --check

  differential:
    name: Nightly Rust vs Lean differential
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/vertep-lean
          build: true
          test: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vertep-conformance --release --features differential -- --ignored differential

  cluster-platforms:
    name: Cluster shard hash on ${{ matrix.os }}
    strategy:
      matrix:
        # Linux and macOS on x86_64 and aarch64: the golden vectors of the shard hash
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vertep-cluster --test placement same_iri_same_shard_everywhere

  cluster-faults:
    name: Nightly cluster fault injection
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      VERTEP_HISTORY_DIR: ${{ github.workspace }}/cluster-histories
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/vertep-lean
          build: true
          test: false
      - uses: Swatinem/rust-cache@v2
      # `differential`: the histories must replay through the Lean lease model (m4-cluster 6.5).
      # The fault matrix: static, external stand-in, gossip, etcd and Kubernetes membership, each
      # with a shared journal and replication factors 1 and 3; etcd and k3s run in containers,
      # and `containers` runs every node as a container process (m4-cluster 6.1, 6.3).
      - run: cargo test -p vertep-cluster --release --features differential,etcd,kubernetes --test faults --test simulation --test runtime --test external --test containers -- --test-threads 2
        env:
          VERTEP_CONTAINER_TESTS: require
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-histories
          path: cluster-histories

  wasm:
    name: WebAssembly core, bindings and npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: vertep-core builds for wasm32 with default features
        run: cargo build -p vertep-core --target wasm32-unknown-unknown
      - name: No target-specific code in vertep-core
        run: |
          if grep -rnE 'target_(arch|os|family)|wasm_bindgen|js_sys|web_sys' crates/vertep-core/src; then
            echo "vertep-core must have no target-specific code paths" >&2
            exit 1
          fi
      - run: cargo test -p vertep-wasm --features journal
      - name: wasm-bindgen CLI at the crate's pinned version
        run: cargo install wasm-bindgen-cli --locked --version "$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' crates/vertep-wasm/Cargo.toml)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - working-directory: bindings/js
        run: npm ci
      - working-directory: bindings/js
        run: npm run build
      - name: Package versions equal the crate version
        working-directory: bindings/js
        run: npm run check:version
      - name: Tests in Node.js and headless Chrome
        working-directory: bindings/js
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test
      - name: Bundle size budget
        working-directory: bindings/js
        run: npm run check:size

  python:
    name: Python bindings on Python ${{ matrix.python }}
    # Pinned: ubuntu-latest moved to 26.04, which setup-python has no CPython 3.9 for.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest CPython the abi3 wheel supports
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Package version equals the workspace version
        if: matrix.python == '3.13'
        run: python bindings/python/scripts/check_version.py
      - name: Build the extension and install it
        working-directory: bindings/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          maturin develop
      - name: Tests, including every example against its recorded output
        working-directory: bindings/python
        run: |
          . .venv/bin/activate
          pytest -q
      - name: The sdist builds
        if: matrix.python == '3.13'
        working-directory: bindings/python
        run: |
          . .venv/bin/activate
          maturin sdist

  # M13 production-readiness, "Supply Chain Gate": an open advisory, a licence outside deny.toml's
  # list, a yanked crate or an unknown source fails CI (and the release workflow runs it again).
  supply-chain:
    name: Supply chain gate (cargo deny, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      - name: Advisories, licences, bans and sources of the Rust workspace
        run: scripts/check-supply-chain.sh
      - name: deny.toml rejects a dependency with an open advisory
        run: scripts/check-supply-chain.sh --self-test
      - name: Advisories of what the npm packages install
        working-directory: bindings/js
        run: npm audit --omit=dev --audit-level=low

  # M13 production-readiness, "Reproducible Toolchain": the one documented command, inside the
  # pinned image, from a clean checkout (no target/ cache), builds @vertep/web, @vertep/dm-ecma and
  # the Python wheel and smoke-tests each. Only the image layers and the crate downloads are cached.
  reproducible-build:
    name: Reproducible build (pinned container, clean checkout)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: The pins agree, and a drifted wasm-bindgen pin fails naming both versions
        run: scripts/check-toolchain.sh --self-test
      - uses: docker/setup-buildx-action@v3
      - name: The build image (.devcontainer/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: scripts
          file: .devcontainer/Dockerfile
          tags: vertep-build:ci
          load: true
          cache-from: type=gha,scope=vertep-build
          cache-to: type=gha,mode=max,scope=vertep-build
      - uses: actions/cache@v4
        with:
          path: target/container-cargo-registry
          key: container-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: container-cargo-registry-
      - name: scripts/build.sh --container
        env:
          VERTEP_BUILD_IMAGE: vertep-build:ci
          VERTEP_SKIP_IMAGE_BUILD: "1"
        run: scripts/build.sh --container
      - uses: actions/upload-artifact@v4
        with:
          name: reproducible-build
          path: dist
          retention-days: 7

  # M13 production-readiness, "Ten Minute Path": the site's quick start (site/docs/index.html,
  # from #build) and the credit-decision example page, followed on a clean runner with only what
  # the pages say to install (rustup picks the toolchain from rust-toolchain.toml); no build cache.
  ten-minute-path:
    name: Ten-minute path (site quick start and credit-decision, clean runner)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: A drifted page or a failing command fails and names the step
        run: python3 scripts/ten-minute-path.py --self-test
      - name: Follow the pages
        run: python3 scripts/ten-minute-path.py ${{ github.event_name == 'schedule' && '--full' || '' }}
