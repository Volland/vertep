[workspace]
resolver = "3"
members = [
    "crates/vertep-core",
    "crates/vertep-scxml",
    "crates/vertep-dm-ecma",
    "crates/vertep-rdf",
    "crates/vertep-conformance",
    "crates/vertep-testkit",
    "crates/vertep-yaml",
    "crates/vertep-dm-cel",
    "crates/vertep-store",
    "crates/vertep-tiramemsu",
    "crates/vertep-oxigraph",
    "crates/vertep-runtime",
    "crates/vertep",
    "crates/vertep-macros",
    "crates/vertep-dm-rust",
    "crates/vertep-cli",
    "crates/vertep-cluster",
    "crates/vertep-federation",
    "crates/vertep-agent",
    "crates/vertep-wasm",
    "crates/vertep-objects",
    "crates/vertep-tsp-mediator",
    "crates/vertep-webvh",
    "crates/vertep-wallet",
    "examples",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Volland/vertep"
authors = ["Volodymyr Pavlyshyn"]

[workspace.dependencies]
vertep-core = { path = "crates/vertep-core", version = "0.1.5", default-features = false }
vertep-scxml = { path = "crates/vertep-scxml", version = "0.1.5" }
vertep-dm-ecma = { path = "crates/vertep-dm-ecma", version = "0.1.5" }
vertep-rdf = { path = "crates/vertep-rdf", version = "0.1.5" }
vertep-testkit = { path = "crates/vertep-testkit" }
vertep-yaml = { path = "crates/vertep-yaml", version = "0.1.5" }
vertep-dm-cel = { path = "crates/vertep-dm-cel", version = "0.1.5" }
vertep-store = { path = "crates/vertep-store", version = "0.1.5" }
vertep-tiramemsu = { path = "crates/vertep-tiramemsu", version = "0.1.5" }
vertep-oxigraph = { path = "crates/vertep-oxigraph", version = "0.1.5" }
vertep-runtime = { path = "crates/vertep-runtime", version = "0.1.5" }
vertep-macros = { path = "crates/vertep-macros", version = "0.1.5" }
vertep-dm-rust = { path = "crates/vertep-dm-rust", version = "0.1.5" }
vertep-agent = { path = "crates/vertep-agent", version = "0.1.5" }
vertep-federation = { path = "crates/vertep-federation", version = "0.1.5" }
vertep-cluster = { path = "crates/vertep-cluster", version = "0.1.5", default-features = false }
vertep-objects = { path = "crates/vertep-objects", version = "0.1.5" }
vertep-tsp-mediator = { path = "crates/vertep-tsp-mediator", version = "0.1.5" }
vertep-webvh = { path = "crates/vertep-webvh", version = "0.1.5", default-features = false }
vertep-wallet = { path = "crates/vertep-wallet", version = "0.1.5", default-features = false }
# vertep-macros: token parsing and code generation for statechart! and include_chart!.
# `span-locations` gives the line and column of macro input tokens for IR spans.
syn = { version = "2.0.119", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# vertep-dm-rust: compile-fail tests of the generated API and the macros.
trybuild = "1.0.122"
# Storage layer (vertep-store, vertep-tiramemsu, vertep-oxigraph). The oxrdf family is the one
# vertep-rdf uses (RDF 1.2); spargebra/spareval/sparesults match the versions oxigraph pins.
oxrdf = { version = "0.3.5", features = ["rdf-12", "rdfc-10"] }
spargebra = { version = "0.4.8", features = ["sparql-12"] }
spareval = { version = "0.2.9", features = ["sparql-12"] }
sparesults = { version = "0.3.5", features = ["sparql-12"] }
oxigraph = { version = "0.5.13", default-features = false, features = ["rdf-12"] }
tiramemsu = { version = "0.12.0", default-features = false, features = ["sparql"] }
# vertep-dm-cel: linear-time regular expressions for CEL `matches`, without std.
regex-automata = { version = "0.4.18", default-features = false, features = ["alloc", "syntax", "nfa-pikevm", "unicode"] }
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }
# vertep-runtime: the tokio shell and its future combinators.
tokio = { version = "1.54", default-features = false }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
# vertep-cluster: QUIC cluster transport with mutual TLS (ring provider, no aws-lc build),
# certificate parsing for peer identity, and cluster certificate issuance.
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103.4", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.5", default-features = false, features = ["ring", "pem", "crypto"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# boa runs ECMAScript guards in generated differential charts; unoptimized it is ~300x slower,
# which turns the debug-mode smoke samples into multi-minute runs.
[profile.dev.package.boa_engine]
opt-level = 3
[profile.dev.package.boa_gc]
opt-level = 3
[profile.dev.package.boa_parser]
opt-level = 3
[profile.dev.package.boa_ast]
opt-level = 3
[profile.dev.package.boa_interner]
opt-level = 3
[profile.dev.package.boa_string]
opt-level = 3
