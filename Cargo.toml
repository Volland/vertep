[workspace]
resolver = "3"
members = [
    "crates/vertep-core",
    "crates/vertep-scxml",
    "crates/vertep-dm-ecma",
    "crates/vertep-rdf",
    "crates/vertep-conformance",
    "crates/vertep-testkit",
    "crates/vertep-yaml",
    "crates/vertep-dm-cel",
    "crates/vertep-store",
    "crates/vertep-tiramemsu",
    "crates/vertep-oxigraph",
    "crates/vertep-runtime",
    "crates/vertep",
    "crates/vertep-macros",
    "crates/vertep-dm-rust",
    "crates/vertep-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Volland/vertep"
authors = ["Volodymyr Pavlyshyn"]

[workspace.dependencies]
vertep-core = { path = "crates/vertep-core", version = "0.1.0", default-features = false }
vertep-scxml = { path = "crates/vertep-scxml", version = "0.1.0" }
vertep-dm-ecma = { path = "crates/vertep-dm-ecma", version = "0.1.0" }
vertep-rdf = { path = "crates/vertep-rdf", version = "0.1.0" }
vertep-testkit = { path = "crates/vertep-testkit" }
vertep-yaml = { path = "crates/vertep-yaml", version = "0.1.0" }
vertep-dm-cel = { path = "crates/vertep-dm-cel", version = "0.1.0" }
vertep-store = { path = "crates/vertep-store", version = "0.1.0" }
vertep-tiramemsu = { path = "crates/vertep-tiramemsu", version = "0.1.0" }
vertep-oxigraph = { path = "crates/vertep-oxigraph", version = "0.1.0" }
vertep-runtime = { path = "crates/vertep-runtime", version = "0.1.0" }
vertep-macros = { path = "crates/vertep-macros", version = "0.1.0" }
vertep-dm-rust = { path = "crates/vertep-dm-rust", version = "0.1.0" }
# Storage layer (vertep-store, vertep-tiramemsu, vertep-oxigraph). The oxrdf family is the one
# vertep-rdf uses (RDF 1.2); spargebra/spareval/sparesults match the versions oxigraph pins.
oxrdf = { version = "0.3.5", features = ["rdf-12", "rdfc-10"] }
spargebra = { version = "0.4.8", features = ["sparql-12"] }
spareval = { version = "0.2.9", features = ["sparql-12"] }
sparesults = { version = "0.3.5", features = ["sparql-12"] }
oxigraph = { version = "0.5.13", default-features = false, features = ["rdf-12"] }
tiramemsu = { version = "0.12.0", default-features = false, features = ["sparql"] }
# vertep-dm-cel: linear-time regular expressions for CEL `matches`, without std.
regex-automata = { version = "0.4.18", default-features = false, features = ["alloc", "syntax", "nfa-pikevm", "unicode"] }
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
