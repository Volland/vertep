<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t">
  <title id="t">Alatyr star</title>
  <!-- The Alatyr star: two interlaced squares, an inner pair, and a sun at the centre.
       Woodcut treatment: ink bands with a paper core, hatching over the orange field. -->
  <defs>
    <pattern id="star-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#17120f" stroke-width="1.1"/>
    </pattern>
  </defs>
  <g stroke-linejoin="miter">
    <!-- orange field of the outer star -->
    <path d="M120 8 L232 120 L120 232 L8 120 Z" fill="#e8641c"/>
    <path d="M40.8 40.8 H199.2 V199.2 H40.8 Z" fill="#e8641c"/>
    <path d="M120 8 L232 120 L120 232 L8 120 Z" fill="url(#star-hatch)" opacity=".38"/>
    <path d="M40.8 40.8 H199.2 V199.2 H40.8 Z" fill="url(#star-hatch)" opacity=".38"/>
    <!-- outer bands -->
    <path d="M120 8 L232 120 L120 232 L8 120 Z" fill="none" stroke="#17120f" stroke-width="13"/>
    <path d="M40.8 40.8 H199.2 V199.2 H40.8 Z" fill="none" stroke="#17120f" stroke-width="13"/>
    <path d="M120 8 L232 120 L120 232 L8 120 Z" fill="none" stroke="#fbf6ec" stroke-width="4.5"/>
    <path d="M40.8 40.8 H199.2 V199.2 H40.8 Z" fill="none" stroke="#fbf6ec" stroke-width="4.5"/>
    <!-- inner star on paper -->
    <path d="M120 54 L186 120 L120 186 L54 120 Z" fill="#fbf6ec"/>
    <path d="M73.3 73.3 H166.7 V166.7 H73.3 Z" fill="#fbf6ec"/>
    <path d="M120 54 L186 120 L120 186 L54 120 Z" fill="none" stroke="#17120f" stroke-width="7"/>
    <path d="M73.3 73.3 H166.7 V166.7 H73.3 Z" fill="none" stroke="#17120f" stroke-width="7"/>
  </g>
  <!-- the sun -->
  <circle cx="120" cy="120" r="27" fill="#e8641c" stroke="#17120f" stroke-width="6"/>
  <circle cx="120" cy="120" r="9" fill="#17120f"/>
  <g stroke="#17120f" stroke-width="3" stroke-linecap="round">
    <path d="M120 99 V93 M120 141 V147 M99 120 H93 M141 120 H147"/>
    <path d="M105.2 105.2 L101 101 M134.8 105.2 L139 101 M105.2 134.8 L101 139 M134.8 134.8 L139 139"/>
  </g>
  <!-- tips -->
  <g fill="#17120f">
    <circle cx="120" cy="8" r="5"/><circle cx="232" cy="120" r="5"/><circle cx="120" cy="232" r="5"/><circle cx="8" cy="120" r="5"/>
    <circle cx="40.8" cy="40.8" r="5"/><circle cx="199.2" cy="40.8" r="5"/><circle cx="199.2" cy="199.2" r="5"/><circle cx="40.8" cy="199.2" r="5"/>
  </g>
</svg>
