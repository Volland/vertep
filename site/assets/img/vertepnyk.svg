<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t">
  <title id="t">Vertepnyk</title>
  <!-- The vertepnyk: the puppeteer in the lower stage of the vertep, working two puppets along the slots in the stage floor under the Christmas star. The arrow between the puppets is a transition. -->
  <defs>
    <pattern id="vn-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#17120f" stroke-width="1.1"/>
    </pattern>
    <pattern id="vn-hatch-cream" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#fbf6ec" stroke-width="1.2"/>
    </pattern>
    <clipPath id="vn-lower"><rect x="50" y="146" width="140" height="58"/></clipPath>
    <clipPath id="vn-upper"><rect x="72" y="86" width="96" height="46"/></clipPath>
  </defs>
  <rect x="6" y="6" width="228" height="228" rx="34" fill="#fbf6ec" stroke="#17120f" stroke-width="6"/>
  <rect x="14" y="14" width="212" height="212" rx="27" fill="none" stroke="#e8641c" stroke-width="2.5"/>

  <!-- star: eight rays, the vertep star -->
  <g stroke-linejoin="miter">
    <path d="M120.0,8.0 L123.6,22.2 L136.3,14.7 L128.8,27.4 L143.0,31.0 L128.8,34.6 L136.3,47.3 L123.6,39.8 L120.0,54.0 L116.4,39.8 L103.7,47.3 L111.2,34.6 L97.0,31.0 L111.2,27.4 L103.7,14.7 L116.4,22.2 Z" fill="#e8641c" stroke="#17120f" stroke-width="4"/>
    <path d="M124.6,19.9 L123.9,27.1 L131.1,26.4 L125.5,31.0 L131.1,35.6 L123.9,34.9 L124.6,42.1 L120.0,36.5 L115.4,42.1 L116.1,34.9 L108.9,35.6 L114.5,31.0 L108.9,26.4 L116.1,27.1 L115.4,19.9 L120.0,25.5 Z" fill="#fbf6ec" stroke="#17120f" stroke-width="2"/>
  </g>
  <circle cx="120" cy="31" r="3" fill="#17120f"/>

  <!-- upper roof -->
  <path d="M120 54 L180 88 L60 88 Z" fill="#17120f"/>
  <path d="M120 62 L164 86 L76 86 Z" fill="url(#vn-hatch-cream)" opacity=".55"/>
  <path d="M120 54 L180 88 L60 88 Z" fill="none" stroke="#17120f" stroke-width="5" stroke-linejoin="miter"/>

  <!-- upper stage -->
  <rect x="72" y="88" width="96" height="44" fill="#fbf6ec"/>
  <g clip-path="url(#vn-upper)">
    <rect x="72" y="88" width="96" height="44" fill="url(#vn-hatch)" opacity=".18"/>
    <path d="M72 88 L72 120 Q84 108 90 88 Z" fill="#e8641c" stroke="#17120f" stroke-width="2.5"/>
    <path d="M168 88 L168 120 Q156 108 150 88 Z" fill="#e8641c" stroke="#17120f" stroke-width="2.5"/>
    <!-- the floor with its two slots -->
    <rect x="72" y="126" width="96" height="6" fill="#17120f"/>
    <rect x="89" y="126" width="6" height="6" fill="#fbf6ec"/>
    <rect x="145" y="126" width="6" height="6" fill="#fbf6ec"/>
    <!-- transition between the puppets -->
    <path d="M102 112 Q120 100 136 112" fill="none" stroke="#e8641c" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M139 113 L129 113 L134 105 Z" fill="#e8641c"/>
    <!-- puppets -->
    <g fill="#17120f" stroke="#17120f" stroke-linejoin="round">
      <circle cx="92" cy="101" r="4.6" fill="#fbf6ec" stroke-width="2.4"/>
      <path d="M86 126 L87.5 108 L96.5 108 L98 126 Z" stroke-width="2"/>
      <circle cx="148" cy="101" r="4.6" fill="#fbf6ec" stroke-width="2.4"/>
      <path d="M142 126 L143.5 108 L152.5 108 L154 126 Z" stroke-width="2"/>
    </g>
  </g>
  <rect x="72" y="88" width="96" height="44" fill="none" stroke="#17120f" stroke-width="5"/>

  <!-- lower roof / stage floor band -->
  <path d="M38 142 L56 130 L184 130 L202 142 Z" fill="#17120f"/>
  <rect x="44" y="142" width="152" height="6" fill="#17120f"/>

  <!-- lower stage -->
  <rect x="50" y="148" width="140" height="56" fill="#fbf6ec"/>
  <g clip-path="url(#vn-lower)">
    <rect x="50" y="148" width="140" height="56" fill="url(#vn-hatch)" opacity=".16"/>
    <path d="M50 148 L50 190 Q68 174 74 148 Z" fill="#e8641c" stroke="#17120f" stroke-width="2.5"/>
    <path d="M190 148 L190 190 Q172 174 166 148 Z" fill="#e8641c" stroke="#17120f" stroke-width="2.5"/>
  </g>

  <!-- rods rising from the puppeteer's hands through the slots -->
  <g stroke="#e8641c" stroke-width="3.6" stroke-linecap="round">
    <path d="M92 158 L92 124"/>
    <path d="M148 158 L148 124"/>
  </g>

  <!-- the vertepnyk -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- arms -->
    <path d="M107 178 L92 160" stroke="#17120f" stroke-width="7" fill="none"/>
    <path d="M133 178 L148 160" stroke="#17120f" stroke-width="7" fill="none"/>
    <circle cx="92" cy="159" r="3.6" fill="#fbf6ec" stroke="#17120f" stroke-width="2"/>
    <circle cx="148" cy="159" r="3.6" fill="#fbf6ec" stroke="#17120f" stroke-width="2"/>
    <!-- body (svyta) -->
    <path d="M104 176 Q120 170 136 176 L141 204 L99 204 Z" fill="#17120f"/>
    <!-- embroidered collar -->
    <path d="M113 173 L120 184 L127 173 Z" fill="#fbf6ec" stroke="#e8641c" stroke-width="1.6"/>
    <!-- sash -->
    <path d="M101 194 Q120 199 139 194 L140 200 Q120 205 100 200 Z" fill="#e8641c"/>
    <!-- head -->
    <circle cx="120" cy="163" r="9.2" fill="#fbf6ec" stroke="#17120f" stroke-width="3.4"/>
    <!-- fur cap with a red crown -->
    <path d="M110 160 Q111 149 120 148 Q129 149 130 160 Q120 156 110 160 Z" fill="#17120f"/>
    <path d="M114 150.5 Q120 146 126 150.5" fill="none" stroke="#e8641c" stroke-width="3"/>
    <!-- moustache -->
    <path d="M113 168 Q120 164 127 168 Q123 172.5 120 169.6 Q117 172.5 113 168 Z" fill="#17120f"/>
    <!-- eyes -->
    <circle cx="116.4" cy="162.6" r="1.1" fill="#17120f"/>
    <circle cx="123.6" cy="162.6" r="1.1" fill="#17120f"/>
  </g>

  <rect x="50" y="148" width="140" height="56" fill="none" stroke="#17120f" stroke-width="5"/>
  <!-- feet -->
  <path d="M44 204 L196 204 L202 214 L38 214 Z" fill="#17120f"/>
  <path d="M30 216 H210" stroke="#e8641c" stroke-width="3" stroke-linecap="round"/>
</svg>
