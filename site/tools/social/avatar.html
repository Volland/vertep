<!doctype html>
<!-- Bluesky avatar for @vertep.org, 1000 x 1000. Rendered by render.sh; Bluesky crops it to a circle. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;height:1000px;overflow:hidden;background:#17120f}
.stage{position:relative;width:1000px;height:1000px}
.rays{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#e8641c 0 4deg,transparent 4deg 12deg);
  -webkit-mask:radial-gradient(circle,transparent 0 34%,#000 35% 45%,transparent 49%);opacity:.85}
.ring{position:absolute;inset:18px;border-radius:50%;border:6px solid #e8641c;box-shadow:inset 0 0 0 14px #17120f,inset 0 0 0 18px #fbf6ec}
.seal{position:absolute;left:110px;top:110px;width:780px;height:780px}
</style></head><body><div class="stage">
<div class="rays"></div><div class="ring"></div>
<img class="seal" src="../../assets/img/logo.svg" alt="">
</div></body></html>
